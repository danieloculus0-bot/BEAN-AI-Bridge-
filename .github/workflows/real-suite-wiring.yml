name: Real cross-repository wiring (Windows and Linux)

on:
  pull_request:
    branches: [main]
    paths:
      - 'integration_tests/test_real_suite_wiring.py'
      - '.github/workflows/real-suite-wiring.yml'
  push:
    branches: [main]
    paths:
      - 'integration_tests/test_real_suite_wiring.py'
      - '.github/workflows/real-suite-wiring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-wiring:
    name: Bridge + Core + FEA (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout actual Bridge source under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned, real BEAN Core source
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 0110bc7214ac8e9b69e5b781293f1b04d372287b
          path: bean-core
          persist-credentials: false
      - name: Checkout pinned, real EZ-FEA source
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/EZ-FEA
          ref: 4aeaa857cad35dca5179078e4cb14c82b86cbd69
          path: fea-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install BEAN runtime dependency
        run: python -m pip install psutil
      - name: Check syntax for wiring contracts
        run: python -m compileall -q integration_tests/test_real_suite_wiring.py bean-core/bean/integration fea-core/ezfea/bean.py
      - name: Exercise real two-repository handoffs and persistent state
        run: python -m unittest discover -s tests -p test_real_suite_wiring.py -v
