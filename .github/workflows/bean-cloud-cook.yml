name: BEAN cloud operations experiment

on:
  push:
    branches: [feature/cloud-pilot-rehearsal-20261019]
  pull_request:
    branches: [feature/operational-pilot-readiness-20261019]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-rehearsal:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build installable offline application wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install the just-built wheel, not editable source
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import subprocess
          import sys
          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', wheels[0]], check=True)
          PY
      - name: Exercise installed command-line tools
        run: |
          bean-export --help
          bean-brief --help
          bean-pilot --help
          bean-backup --help
      - name: Execute full fictional 10-workday rehearsal twice
        run: python -m experiments.cloud_operations_rehearsal.run --out cloud-rehearsal-evidence
      - name: Independently verify synthetic replay and receipt tests
        run: |
          python -m unittest discover -s tests -p test_cloud_rehearsal.py -v
          python -m unittest discover -s tests -p test_backup.py -v
      - name: Upload explicitly labeled synthetic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bean-cloud-fictional-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            cloud-rehearsal-evidence/*.json
            cloud-rehearsal-evidence/*.html
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
