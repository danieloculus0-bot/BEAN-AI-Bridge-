name: BEAN JobBOSS export sponge smoke

on:
  push:
    branches:
      - main
      - promote/jobboss-evidence-sponge-20261010
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jobboss-extract-replay:
    name: JobBOSS file drop and replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional BIFF reader and synthetic fixture writer
        run: python -m pip install xlrd==2.0.2 xlwt==1.3.0
      - name: Compile bridge and importer
        run: python -m compileall -q src tests
      - name: Run original bridge plus JobBOSS synthetic regression
        run: python -m unittest discover -s tests -v
      - name: Repeat JobBOSS suite
        run: python -m unittest discover -s tests -p 'test_jobboss*.py' -v
      - name: Confirm import and private BIFF adapter CLI available
        run: |
          python -m ezbean.jobboss_exports --help
          python -m ezbean.jobboss_xls_adapter --help
