name: BEAN evidence learning loop cross-platform

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ezbean/learning_loop.py'
      - 'src/ezbean/__init__.py'
      - 'tests/test_learning_loop_lab009.py'
      - 'experiments/learning_loop/**'
      - '.github/workflows/bean-evidence-learning-loop.yml'
  push:
    branches: [main]
    paths:
      - 'src/ezbean/learning_loop.py'
      - 'src/ezbean/__init__.py'
      - 'tests/test_learning_loop_lab009.py'
      - 'experiments/learning_loop/**'
      - '.github/workflows/bean-evidence-learning-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-loop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout BEAN Bridge
        uses: actions/checkout@v4
      - name: Checkout pinned real BEAN Core
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: bddf32c1368ddf1853d3d2e51ee2f99081e2cc4c
          path: bean-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest psutil
      - name: Compile Bridge and lab
        run: python -m compileall -q src tests/test_learning_loop_lab009.py experiments/learning_loop
      - name: Test learning loop with real Core on Linux
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/bean-core:${{ github.workspace }}
        run: python -m pytest tests/test_learning_loop_lab009.py -q --junitxml=lab009-tests.xml
      - name: Test learning loop with real Core on Windows
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: ${{ github.workspace }}\src;${{ github.workspace }}\bean-core;${{ github.workspace }}
        run: python -m pytest tests/test_learning_loop_lab009.py -q --junitxml=lab009-tests.xml
      - name: Generate durable replay receipt on Linux
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/bean-core:${{ github.workspace }}
        run: python -m experiments.learning_loop.run_lab009 --out lab009-evidence.json --evidence-dir lab009-audit
      - name: Generate durable replay receipt on Windows
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: ${{ github.workspace }}\src;${{ github.workspace }}\bean-core;${{ github.workspace }}
        run: python -m experiments.learning_loop.run_lab009 --out lab009-evidence.json --evidence-dir lab009-audit
      - name: Archive research receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-lab009-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            lab009-tests.xml
            lab009-evidence.json
            lab009-audit/*.sqlite
          if-no-files-found: ignore
