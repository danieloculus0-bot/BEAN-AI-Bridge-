name: BEAN autonomous Bridge improvement experiment

on:
  workflow_dispatch:
  schedule:
    # Daily evaluation. UTC schedule is intentionally approximate in local time.
    - cron: '23 13 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/bean_bridge_agent.py'
      - '.github/workflows/bean-autonomous-improvement.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/bean_bridge_agent.py'
      - '.github/workflows/bean-autonomous-improvement.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bean-bridge-improver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge-auto-improvement:
    name: BEAN plans, modifies, verifies, and proposes one Bridge improvement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:_bean_core
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Bridge working tree
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout BEAN main as the decision authority
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: main
          path: _bean_core
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile existing project and agent
        run: python -m compileall -q src tests tools/bean_bridge_agent.py
      - name: BEAN autonomous candidate selection and applied change
        id: bean
        run: python tools/bean_bridge_agent.py --apply --receipt .bean-agent/receipt.json
      - name: Upload independent source and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-bridge-improvement-receipt-${{ github.run_id }}
          path: .bean-agent/receipt.json
          if-no-files-found: warn
      - name: Create isolated code improvement PR, never push main
        if: steps.bean.outputs.changed == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="bean/autonomous-bridge-$GITHUB_RUN_ID"
          git config user.name "bean-bridge-agent"
          git config user.email "bean-bridge-agent@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- src/ezbean/core.py src/ezbean/store.py tests/
          git diff --cached --quiet && { echo "No actual change"; exit 1; }
          git commit -m "fix(bridge): BEAN verified $AGENT_CANDIDATE"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "BEAN autonomous improvement: $AGENT_CANDIDATE" \
            --body "Generated by the bounded BEAN source-improvement agent. BEAN ranked reproducible issues and a trusted host applied exactly one approved deterministic transformation. A baseline witness and full unittest suite were run before and after; evidence receipt is attached to workflow run $GITHUB_RUN_ID. This PR MUST be independently reviewed and cross-platform tested before merge. No unattended merge is authorized."
        env:
          AGENT_CANDIDATE: ${{ steps.bean.outputs.candidate }}
