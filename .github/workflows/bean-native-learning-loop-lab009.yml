name: BEAN LAB009 native evidence learning loop

on:
  push:
    branches:
      - experiment/bean-learning-loop-lab009-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-learning:
    name: BEAN Core evidence loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout experimental bridge
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout verified BEAN Core
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: d4ebadaa997854449365ccd16728ced6f2969a54
          path: bean-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest psutil
      - name: Compile and test on Linux
        if: runner.os != 'Windows'
        working-directory: bridge
        env:
          PYTHONPATH: ${{ github.workspace }}/bridge/src:${{ github.workspace }}/bean-core:${{ github.workspace }}/bridge
        run: |
          python -m compileall -q src tests experiments/learning_loop
          python -m pytest tests -q -ra --tb=short --junitxml=lab009-tests.xml
      - name: Compile and test on Windows
        if: runner.os == 'Windows'
        working-directory: bridge
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\bridge\src;${{ github.workspace }}\bean-core;${{ github.workspace }}\bridge
        run: |
          python -m compileall -q src tests experiments/learning_loop
          python -m pytest tests -q -ra --tb=short --junitxml=lab009-tests.xml
      - name: Compile persisted BEAN evidence on Linux
        if: runner.os != 'Windows'
        working-directory: bridge
        env:
          PYTHONPATH: ${{ github.workspace }}/bridge/src:${{ github.workspace }}/bean-core:${{ github.workspace }}/bridge
        run: python -m experiments.learning_loop.run_lab009 --out lab009-evidence.json --evidence-dir lab009-audit
      - name: Compile persisted BEAN evidence on Windows
        if: runner.os == 'Windows'
        working-directory: bridge
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\bridge\src;${{ github.workspace }}\bean-core;${{ github.workspace }}\bridge
        run: python -m experiments.learning_loop.run_lab009 --out lab009-evidence.json --evidence-dir lab009-audit
      - name: Archive real evidence and full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-lab009-evidence-${{ matrix.os }}
          path: |
            bridge/lab009-tests.xml
            bridge/lab009-evidence.json
            bridge/lab009-audit/*.sqlite
          if-no-files-found: ignore
