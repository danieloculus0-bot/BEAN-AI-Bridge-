name: BEAN Evolution Lab synthetic benchmark

on:
  push:
    branches:
      - 'experiment/bean-evolution-lab-20261009'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated bridge experiment
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout experimental BEAN core
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: experiment/bean-capability-lab-20261009
          path: bean-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline test tools
        run: python -m pip install pytest psutil
      - name: Verify existing bridge and evolution tests
        working-directory: bridge
        run: |
          export PYTHONPATH="$PWD/src:$GITHUB_WORKSPACE/bean-core:$PWD"
          python -m pytest tests -q -ra --tb=short
      - name: Evolve bounded BEAN attention policy and score untouched holdout
        working-directory: bridge
        run: |
          export PYTHONPATH="$PWD/src:$GITHUB_WORKSPACE/bean-core:$PWD"
          python -m experiments.evolution_lab.bridge_evolution --generations 6 --population 20 --out evolution-report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-evolution-lab-results
          path: bridge/evolution-report.json
          if-no-files-found: ignore
