name: BEAN operational pilot packaging and reliability

on:
  push:
    branches: [feature/operational-pilot-readiness-20261019]
  pull_request:
    branches: [fix/audit-learning-reliability-20261019, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install BEAN Bridge as an actual package
        run: python -m pip install . pytest psutil
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify installed entry points
        run: |
          bean-export --help
          bean-brief --help
          bean-pilot --help
          bean-backup --help
      - name: Verify all Bridge source compiles
        run: python -m compileall -q src/ezbean tests
      - name: Full existing unit regression suite
        run: python -m unittest discover -s tests -v
      - name: Operational pilot, RMA and backup regression tests
        run: python -m pytest tests/test_pilot.py tests/test_backup.py tests/test_daily_brief.py tests/test_jobboss_exports.py tests/test_management_intelligence.py -q -ra
      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Retain test wheel
        uses: actions/upload-artifact@v4
        with:
          name: bean-pilot-beta-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
