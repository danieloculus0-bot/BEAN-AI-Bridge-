name: BEAN Lab 004 knowledge revision benchmark

on:
  push:
    branches:
      - experiment/bean-model-revision-lab004-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-revision:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout isolated BEAN Bridge branch
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout pinned verified BEAN Core
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 3cf85e63005d97ceaa7484b2d4d61efb0da3ee10
          path: bean-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline tests
        run: python -m pip install pytest psutil
      - name: Run full Bridge regression
        shell: bash
        working-directory: bridge
        run: |
          export PYTHONPATH="$PWD/src:$GITHUB_WORKSPACE/bean-core:$PWD"
          python -m pytest tests -q -ra --tb=short --junitxml=bean-lab004-tests.xml
      - name: Run knowledge revision and regime-shift experiment
        shell: bash
        working-directory: bridge
        run: |
          export PYTHONPATH="$PWD/src:$GITHUB_WORKSPACE/bean-core:$PWD"
          python -m experiments.evolution_lab.model_revision_lab004 --out bean-lab004-report.json
      - name: Archive exact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-lab004-${{ matrix.os }}
          path: |
            bridge/bean-lab004-report.json
            bridge/bean-lab004-tests.xml
          if-no-files-found: ignore
