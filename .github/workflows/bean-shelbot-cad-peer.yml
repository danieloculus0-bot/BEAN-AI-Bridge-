name: BEAN Shelbot independent CAD peer gate

on:
  push:
    branches:
      - experiment/bean-cad-independent-peer-gate-20261011
    paths:
      - 'experiments/robot_cad_peer/**'
      - '.github/workflows/bean-shelbot-cad-peer.yml'
  pull_request:
    branches:
      - experiment/bean-robot-body-lab001-20261010
    paths:
      - 'experiments/robot_cad_peer/**'
      - '.github/workflows/bean-shelbot-cad-peer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad-qa:
    name: Real CAD export and adversarial STEP-STL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent STEP and mesh verification libraries
        run: python -m pip install 'cadquery==2.8.0' 'trimesh==4.11.1'
      - name: Compile and run 11 CAD adversarial tests
        run: |
          python -m compileall -q experiments/robot_cad_peer
          python -m unittest discover -s experiments/robot_cad_peer -p test_cad.py -v
      - name: Export actual STEP STL and independently verify interface geometry
        run: |
          python experiments/robot_cad_peer/axle_fixture.py --out robot-cad-peer-results
          python experiments/robot_cad_peer/verify.py --folder robot-cad-peer-results --receipt robot-cad-peer-results/cad_qa.json
      - name: Preserve editable geometry and SHA256 integrity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-shelbot-cad-peer-results
          path: robot-cad-peer-results/
          if-no-files-found: warn
          retention-days: 21
